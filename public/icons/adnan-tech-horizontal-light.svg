<?xml version="1.0" encoding="UTF-8"?>
<!-- Adnan Tech — full horizontal lockup (light backgrounds). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 96" width="300" height="96"
     role="img" aria-labelledby="at-hl-title at-hl-desc" focusable="false">
  <title id="at-hl-title">Adnan Tech — developed by Adnan Al Qadi</title>
  <desc id="at-hl-desc">AT network monogram tile, the wordmark Adnan Tech, and the founder signature Adnan Al Qadi, dark on light.</desc>
  <defs>
    <linearGradient id="atHlTrace" x1="32" y1="17" x2="32" y2="49" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E7490"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
  </defs>

  <g transform="translate(8,16)">
    <rect x="-8" y="-8" width="80" height="80" rx="20" fill="#F4F7FB" stroke="#DCE5F0"/>
    <path d="M32 17 17 49" stroke="url(#atHlTrace)" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M32 17 47 49" stroke="url(#atHlTrace)" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M22.2 38H41.8" stroke="url(#atHlTrace)" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M16 17H48" stroke="url(#atHlTrace)" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M32 17V49" stroke="url(#atHlTrace)" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <circle cx="16" cy="17" r="2" fill="#0E7490"/>
    <circle cx="48" cy="17" r="2" fill="#0E7490"/>
    <circle cx="22.2" cy="38" r="2" fill="#0E7490"/>
    <circle cx="41.8" cy="38" r="2" fill="#0E7490"/>
    <circle cx="17" cy="49" r="2.5" fill="#0F766E"/>
    <circle cx="47" cy="49" r="2.5" fill="#0F766E"/>
    <circle cx="32" cy="49" r="2.5" fill="#0F766E"/>
    <circle cx="32" cy="17" r="6.2" fill="#F4F7FB"/>
  <circle cx="32" cy="17" r="5.4" fill="none" stroke="#0E7490" stroke-width="1.6"/>
    <circle cx="32" cy="17" r="2.6" fill="#6D28D9"/>
  </g>

  <text x="100" y="50" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="30" font-weight="700"
        letter-spacing="0.5" fill="#0F1C30">Adnan <tspan fill="#0E7490">Tech</tspan></text>
  <path d="M100 61H280" stroke="#DCE5F0" stroke-width="1"/>
  <text x="100" y="79" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="11.5" font-weight="600"
        letter-spacing="2.6" fill="#4B5D76">Adnan Al Qadi</text>
</svg>
