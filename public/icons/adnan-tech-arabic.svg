<?xml version="1.0" encoding="UTF-8"?>
<!-- Adnan Tech — Arabic brand lockup (منصة عدنان تك), dark backgrounds. Right-to-left. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 96" width="300" height="96" xml:lang="ar"
