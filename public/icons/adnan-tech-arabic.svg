    <path d="M32 17 47 49" stroke="url(#atArTrace)" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M22.2 38H41.8" stroke="url(#atArTrace)" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M16 17H48" stroke="url(#atArTrace)" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M32 17V49" stroke="url(#atArTrace)" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <circle cx="16" cy="17" r="2" fill="#35D6F2"/>
    <circle cx="48" cy="17" r="2" fill="#35D6F2"/>
    <circle cx="22.2" cy="38" r="2" fill="#35D6F2"/>
    <circle cx="41.8" cy="38" r="2" fill="#35D6F2"/>
    <circle cx="17" cy="49" r="2.5" fill="#30D6B5"/>
    <circle cx="47" cy="49" r="2.5" fill="#30D6B5"/>
    <circle cx="32" cy="49" r="2.5" fill="#30D6B5"/>
    <circle cx="32" cy="17" r="6.2" fill="#071421"/>
  <circle cx="32" cy="17" r="5.4" fill="none" stroke="#35D6F2" stroke-width="1.6"/>
    <circle cx="32" cy="17" r="2.6" fill="#8B7CF6"/>
