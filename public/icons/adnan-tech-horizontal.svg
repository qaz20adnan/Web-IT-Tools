<?xml version="1.0" encoding="UTF-8"?>
<!-- Adnan Tech — full horizontal lockup (dark backgrounds).
     Monogram + wordmark + founder signature. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 96" width="300" height="96"
     role="img" aria-labelledby="at-h-title at-h-desc" focusable="false">
  <title id="at-h-title">Adnan Tech — developed by Adnan Al Qadi</title>
  <desc id="at-h-desc">AT network monogram tile, the wordmark Adnan Tech, and the founder signature Adnan Al Qadi.</desc>
  <defs>
    <linearGradient id="atHTrace" x1="32" y1="17" x2="32" y2="49" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35D6F2"/>
      <stop offset="1" stop-color="#30D6B5"/>
    </linearGradient>
  </defs>

  <g transform="translate(8,16)">
    <rect x="-8" y="-8" width="80" height="80" rx="20" fill="#071421" stroke="#1B3A50"/>
    <path d="M32 17 17 49" stroke="url(#atHTrace)" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M32 17 47 49" stroke="url(#atHTrace)" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M22.2 38H41.8" stroke="url(#atHTrace)" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M16 17H48" stroke="url(#atHTrace)" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M32 17V49" stroke="url(#atHTrace)" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <circle cx="16" cy="17" r="2" fill="#35D6F2"/>
    <circle cx="48" cy="17" r="2" fill="#35D6F2"/>
    <circle cx="22.2" cy="38" r="2" fill="#35D6F2"/>
    <circle cx="41.8" cy="38" r="2" fill="#35D6F2"/>
    <circle cx="17" cy="49" r="2.5" fill="#30D6B5"/>
    <circle cx="47" cy="49" r="2.5" fill="#30D6B5"/>
    <circle cx="32" cy="49" r="2.5" fill="#30D6B5"/>
    <circle cx="32" cy="17" r="6.2" fill="#071421"/>
  <circle cx="32" cy="17" r="5.4" fill="none" stroke="#35D6F2" stroke-width="1.6"/>
    <circle cx="32" cy="17" r="2.6" fill="#8B7CF6"/>
  </g>

  <text x="100" y="50" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="30" font-weight="700"
        letter-spacing="0.5" fill="#EAF4FA">Adnan <tspan fill="#35D6F2">Tech</tspan></text>
  <path d="M100 61H280" stroke="#1B3A50" stroke-width="1"/>
  <text x="100" y="79" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="11.5" font-weight="600"
        letter-spacing="2.6" fill="#6F8798">Adnan Al Qadi</text>
</svg>
