<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="nexora-primary" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="nexora-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="64" height="64" rx="14" fill="#070D1C"/>

  <!-- Neural network nodes and connections -->
  <circle cx="16" cy="20" r="2.5" fill="#38BDF8"/>
  <circle cx="32" cy="16" r="2.5" fill="#22D3EE"/>
  <circle cx="48" cy="20" r="2.5" fill="#A78BFA"/>
  <circle cx="24" cy="36" r="2.5" fill="#38BDF8"/>
  <circle cx="40" cy="36" r="2.5" fill="#22D3EE"/>

  <!-- Connections -->
  <path d="M18.5 22.5 L29.5 18.5" stroke="#38BDF8" stroke-width="1.5" opacity="0.6"/>
  <path d="M34.5 18.5 L45.5 22.5" stroke="#22D3EE" stroke-width="1.5" opacity="0.6"/>
  <path d="M26.5 33.5 L40.5 38.5" stroke="#A78BFA" stroke-width="1.5" opacity="0.6"/>
  <path d="M20.5 26.5 L26.5 33.5" stroke="#38BDF8" stroke-width="1.5" opacity="0.6"/>

  <!-- Central shield symbol -->
  <path d="M32 12 L44 24 L44 44 L32 52 L20 44 L20 24 Z" fill="none" stroke="url(#nexora-primary)" stroke-width="3" stroke-linejoin="round"/>

  <!-- Circuit lines inside shield -->
  <path d="M32 24 L32 44" stroke="url(#nexora-primary)" stroke-width="1.5" opacity="0.4"/>
  <path d="M24 32 L40 32" stroke="url(#nexora-primary)" stroke-width="1.5" opacity="0.4"/>

  <!-- NEXORA text mark -->
  <text x="32" y="58" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="7" font-weight="700" fill="#E8EEFB" text-anchor="middle" letter-spacing="0.5">NEXORA</text>
  <text x="32" y="63" font-family="monospace" font-size="5" font-weight="600" fill="#38BDF8" text-anchor="middle">AI</text>
</svg>
