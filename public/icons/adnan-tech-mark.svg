<?xml version="1.0" encoding="UTF-8"?>
<!--
  Adnan Tech — primary monogram.
  Concept: the letter A (two legs + crossbar) and the letter T (top bar + spine)
  share the same apex point. The stroke vertices are network nodes; the violet
  apex is the hub. Intended for dark backgrounds (transparent tile).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-labelledby="at-mark-title at-mark-desc" focusable="false">
  <title id="at-mark-title">Adnan Tech monogram</title>
  <desc id="at-mark-desc">Interlocked letter A and letter T forming a network of connected nodes on a dark navy field.</desc>
  <defs>
    <linearGradient id="atTrace" x1="32" y1="17" x2="32" y2="49" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35D6F2"/>
      <stop offset="1" stop-color="#30D6B5"/>
    </linearGradient>
  </defs>

  <!-- A legs -->
  <path d="M32 17 17 49" stroke="url(#atTrace)" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <path d="M32 17 47 49" stroke="url(#atTrace)" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <!-- A crossbar -->
  <path d="M22.2 38H41.8" stroke="url(#atTrace)" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <!-- T top bar -->
  <path d="M16 17H48" stroke="url(#atTrace)" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <!-- T spine (shared A stem) -->
  <path d="M32 17V49" stroke="url(#atTrace)" stroke-width="3.2" stroke-linecap="round" fill="none"/>

  <!-- network nodes -->
  <circle cx="16" cy="17" r="2" fill="#35D6F2"/>
  <circle cx="48" cy="17" r="2" fill="#35D6F2"/>
  <circle cx="22.2" cy="38" r="2" fill="#35D6F2"/>
  <circle cx="41.8" cy="38" r="2" fill="#35D6F2"/>
  <circle cx="17" cy="49" r="2.5" fill="#30D6B5"/>
  <circle cx="47" cy="49" r="2.5" fill="#30D6B5"/>
  <circle cx="32" cy="49" r="2.5" fill="#30D6B5"/>

  <!-- apex hub: restrained violet core inside a cyan ring -->
  <circle cx="32" cy="17" r="6.2" fill="#071421"/>
  <circle cx="32" cy="17" r="5.4" fill="none" stroke="#35D6F2" stroke-width="1.6"/>
  <circle cx="32" cy="17" r="2.6" fill="#8B7CF6"/>
</svg>
